name: C#

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['csharp/**', 'experiments/**/*.cs', 'experiments/**/*.csproj', 'experiments/system_data_sqlite/**', '.github/workflows/csharp.yml', '.github/actions/**']
  pull_request:
    paths: ['csharp/**', 'experiments/**/*.cs', 'experiments/**/*.csproj', 'experiments/system_data_sqlite/**', '.github/workflows/csharp.yml', '.github/actions/**']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: csharp

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/prepare-ci # zizmor: ignore[self-repository] actionlint 1.7.12 lacks $/ syntax
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: csharp/global.json
      - run: dotnet format whitespace SQLiteVSDoublets.slnx --verify-no-changes
      - name: Format every C# experiment
        shell: bash
        run: |
          while IFS= read -r project; do
            dotnet format whitespace "../$project" --verify-no-changes
          done < <(git -C .. ls-files 'experiments/**/*.csproj')
      - run: dotnet build -c Release -warnaserror
      - run: dotnet test --project SQLiteVSDoublets.Tests -c Release --no-build -- --timeout 10m

      - name: Check SQLite provider reports
        run: python ../experiments/system_data_sqlite/check_reports.py

  pipeline-status:
    name: Pipeline Status
    needs: [test]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - run: python -m pip install PyYAML==6.0.3
      - name: Check terminal status
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          WORKFLOW_FILE: .github/workflows/csharp.yml
          RUN_REF: ${{ github.ref }}
          RUN_SHA: ${{ github.sha }}
        run: python scripts/check_pipeline_status.py
