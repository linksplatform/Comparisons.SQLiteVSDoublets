version: 2
updates:
- package-ecosystem: nuget
  directories:
    - "/csharp"
    - "/experiments/csharp_objects_profile"
    - "/experiments/csharp_split_linked_list"
    - "/experiments/csharp_tree_delete"
    - "/experiments/system_data_sqlite"
  schedule:
    interval: daily
  open-pull-requests-limit: 10
  cooldown:
    default-days: 7
- package-ecosystem: cargo
  directories:
    - "/rust"
    - "/experiments/unit_store_growth"
    - "/experiments/sqlite_returning"
    - "/experiments/split_store_delete"
  schedule:
    interval: daily
  open-pull-requests-limit: 10
  cooldown:
    default-days: 7
- package-ecosystem: github-actions
  directory: "/"
  schedule:
    interval: weekly
  cooldown:
    default-days: 7
- package-ecosystem: pip
  directory: "/scripts"
  schedule:
    interval: weekly
  cooldown:
    default-days: 7
