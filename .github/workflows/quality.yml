name: CI quality

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/**', 'scripts/**', 'experiments/**', 'pyproject.toml', 'README*.md', 'CONTRIBUTING.md', 'cpp/**', '.secretlintrc.json', '.pre-commit-config.yaml']
  pull_request:
    paths: ['.github/**', 'scripts/**', 'experiments/**', 'pyproject.toml', 'README*.md', 'CONTRIBUTING.md', 'cpp/**', '.secretlintrc.json', '.pre-commit-config.yaml']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflows:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/prepare-ci # zizmor: ignore[self-repository] actionlint 1.7.12 lacks $/ syntax
      - name: Actionlint and ShellCheck
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - run: python -m pip install zizmor==1.30.1
      - name: Workflow security
        run: |
          zizmor --offline --min-severity medium .github
          zizmor --offline --persona pedantic --min-severity high --min-confidence high .github

  python:
    needs: workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/prepare-ci # zizmor: ignore[self-repository] actionlint 1.7.12 lacks $/ syntax
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - run: python -m pip install -r scripts/requirements.txt -r scripts/requirements-ci.txt
      - run: ruff check scripts experiments
      - run: ruff format --check scripts experiments
      - run: mypy scripts
      - run: python scripts/ci_checks.py
      - run: python -m unittest discover -s scripts -v
      - run: npx --yes markdownlint-cli@0.49.1 README.md README.ru.md CONTRIBUTING.md cpp/README.md
      - name: Scan maintained source for secrets
        run: git ls-files -z -- ':!dev/log/**' ':!docs/benchmarks/**' ':!*.png' | xargs -0 npx --yes -p secretlint@13.0.7 -p @secretlint/secretlint-rule-preset-recommend@13.0.7 secretlint

  pipeline-status:
    name: Pipeline Status
    needs: [workflows, python]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - run: python -m pip install PyYAML==6.0.3
      - name: Check terminal status
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          WORKFLOW_FILE: .github/workflows/quality.yml
          RUN_REF: ${{ github.ref }}
          RUN_SHA: ${{ github.sha }}
        run: python scripts/check_pipeline_status.py
